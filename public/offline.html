<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12786b" />
    <title>Sedang offline — X PPLG 3</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f6f8f7; color: #16302c; text-align: center;
      }
      main { max-width: 360px; }
      img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 6px 20px rgba(18,120,107,.25); }
      h1 { font-size: 1.35rem; margin: 20px 0 8px; }
      p { margin: 0 0 20px; line-height: 1.55; color: #4b625e; }
      button {
        border: 0; border-radius: 10px; padding: 11px 22px; font-size: 1rem; font-weight: 600;
        background: #12786b; color: #fff; cursor: pointer;
      }
      button:active { transform: scale(.97); }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1917; color: #e6f1ee; }
        p { color: #9db5b0; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Kamu sedang offline</h1>
      <p>Halaman ini belum pernah dibuka saat online, jadi belum tersimpan. Sambungkan internet lalu coba lagi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
    <script>
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
